<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <title>SF6 ガードフレームクイズ</title>
  <style>
    :root {
      --bg: #14091f;
      --bg-2: #1d102e;
      --card: #2a1644;
      --card-2: #351c55;
      --line: #5b3a86;
      --accent: #c4b5fd;
      --accent-2: #8b5cf6;
      --btn: #7c3aed;
      --btn-press: #6d28d9;
      --text: #f7f3ff;
      --muted: #c5b4e0;
      --dim: #9a86b8;
      --success: #4ade80;
      --success-bg: #14532d;
      --danger: #fb7185;
      --danger-bg: #4c0519;
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      overscroll-behavior: none;
    }
    body {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(120% 80% at 50% -10%, #3b1d68 0%, transparent 55%),
        linear-gradient(180deg, #1a0c2c 0%, var(--bg) 40%);
    }
    #app {
      height: 100dvh;
      height: 100svh;
      max-width: 430px;
      margin: 0 auto;
      padding: calc(10px + var(--safe-t)) 16px calc(28px + var(--safe-b));
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .screen {
      display: none;
      flex: 1;
      min-height: 0;
      flex-direction: column;
      justify-content: center;
      padding-bottom: 7vh;
      overflow: hidden;
    }
    .screen.on { display: flex; }
    h1 {
      margin: 0;
      font-size: clamp(1.25rem, 6.4vw, 1.7rem);
      letter-spacing: 0.04em;
      line-height: 1.25;
      font-weight: 800;
    }
    .update {
      margin: 8px 0 0;
      color: var(--accent);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.08em;
    }
    .note {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 0.86rem;
      line-height: 1.45;
    }
    .caption {
      color: var(--dim);
      font-size: 0.78rem;
      letter-spacing: 0.04em;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 14px;
    }
    button {
      appearance: none;
      border: 0;
      border-radius: 14px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      color: var(--text);
    }
    .btn {
      width: 100%;
      min-height: 50px;
      padding: 0 16px;
      background: var(--btn);
      box-shadow: 0 4px 0 #4c1d95;
      font-size: 1rem;
    }
    .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #4c1d95; }
    .btn.secondary {
      background: var(--card-2);
      box-shadow: 0 4px 0 #1a0a2e;
      border: 1px solid var(--line);
    }
    .btn.secondary:active { box-shadow: 0 2px 0 #1a0a2e; }
    .progress {
      color: var(--dim);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.06em;
    }
    .char-name {
      margin-top: 6px;
      color: var(--accent);
      font-size: 0.8rem;
      font-weight: 700;
    }
    .move-name {
      margin-top: 4px;
      font-size: clamp(0.92rem, 4.3vw, 1.15rem);
      font-weight: 800;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }
    .command {
      margin-top: 5px;
      color: var(--muted);
      font-size: clamp(0.72rem, 3.3vw, 0.86rem);
      line-height: 1.35;
      overflow-wrap: anywhere;
      font-feature-settings: "palt";
    }
    .prompt {
      margin: 8px 0;
      color: var(--muted);
      font-size: 0.88rem;
    }
    .choices {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }
    .choice {
      min-height: 52px;
      padding: 8px 6px;
      background: var(--card);
      border: 1.5px solid var(--line);
      border-radius: 14px;
      font-size: 1.12rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      color: var(--text);
    }
    .choice:active { background: var(--card-2); }
    .choice.correct {
      background: var(--success-bg);
      border-color: var(--success);
      color: var(--success);
    }
    .choice.wrong {
      background: var(--danger-bg);
      border-color: var(--danger);
      color: var(--danger);
    }
    .choice.muted {
      opacity: 0.45;
    }
    .banner {
      margin: 4px 0 6px;
      font-size: clamp(1.6rem, 8vw, 2.15rem);
      font-weight: 800;
      line-height: 1.1;
    }
    .banner.ok { color: var(--success); }
    .banner.ng { color: var(--danger); }
    .status {
      display: inline-block;
      align-self: flex-start;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      line-height: 1.35;
    }
    .status.ok { background: var(--success-bg); color: var(--success); }
    .status.ng { background: var(--danger-bg); color: var(--danger); }
    .recap {
      margin: 8px 0 6px;
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.4;
      overflow-wrap: anywhere;
      max-height: 3.1em;
      overflow: hidden;
    }
    .score-label {
      margin-top: 12px;
      color: var(--muted);
      font-size: 0.85rem;
    }
    .score-num {
      margin-top: 4px;
      font-size: clamp(2.6rem, 16vw, 3.6rem);
      font-weight: 800;
      letter-spacing: 0.02em;
      line-height: 1;
    }
    .confetti {
      position: relative;
      height: 10px;
      pointer-events: none;
    }
    .confetti i {
      position: absolute;
      top: 0;
      border-radius: 2px;
      opacity: 0;
      animation: burst 1.05s ease-out forwards;
    }
    @keyframes burst {
      0% { opacity: 0; transform: translate(-50%, 0) scale(0.6); }
      14% { opacity: 1; }
      100% { opacity: 0; transform: translate(var(--dx), 68px) scale(1); }
    }
    .title-block { margin-top: 8px; }
    .select-lead {
      margin: 8px 0 14px;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.45;
    }
    .select-note {
      margin: 8px 0 14px;
      color: var(--dim);
      font-size: 0.78rem;
    }
    .note + .note { margin-top: 4px; }
    #screen-select {
      justify-content: center;
      padding-bottom: 3vh;
    }
    #screen-select .select-lead {
      margin: 0 0 8px;
      flex-shrink: 0;
    }
    .char-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
      width: 100%;
      min-height: 0;
      flex: 0 1 auto;
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
    }
    .char-btn {
      width: 100%;
      min-height: 36px;
      padding: 5px 2px;
      background: var(--card-2);
      box-shadow: 0 2px 0 #1a0a2e;
      border: 1px solid var(--line);
      border-radius: 10px;
      font-size: clamp(0.6rem, 2.85vw, 0.74rem);
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -0.02em;
      overflow-wrap: anywhere;
    }
    .char-btn:active { transform: translateY(1px); box-shadow: 0 1px 0 #1a0a2e; }
    #screen-select .actions {
      margin-top: 10px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <main id="app">
    <section id="screen-title" class="screen on">
      <div class="title-block">
        <h1>SF6 ガードフレームクイズ</h1>
        <p class="update">2026.10.13 update</p>
        <p class="note">このクイズは、技を出した側の視点の硬直差です</p>
        <p class="note">このクイズの硬直差は公式サイトのデータです</p>
      </div>
      <div class="actions">
        <button type="button" class="btn" id="btn-random">ランダム10問</button>
        <button type="button" class="btn secondary" id="btn-char10">キャラ選択10問</button>
        <button type="button" class="btn secondary" id="btn-charall">キャラ選択全技</button>
      </div>
    </section>

    <section id="screen-select" class="screen">
      <p class="select-lead" id="select-lead"></p>
      <div class="char-grid" id="char-grid"></div>
      <div class="actions">
        <button type="button" class="btn secondary" id="btn-select-back">タイトルへ戻る</button>
      </div>
    </section>

    <section id="screen-question" class="screen">
      <div class="progress" id="q-progress"></div>
      <div class="char-name" id="q-char"></div>
      <div class="move-name" id="q-name"></div>
      <div class="command" id="q-command"></div>
      <p class="prompt">ガードさせた時の硬直差は？</p>
      <div class="choices" id="q-choices"></div>
    </section>

    <section id="screen-result" class="screen">
      <div class="progress" id="r-progress"></div>
      <div class="confetti" id="r-confetti" aria-hidden="true"></div>
      <div class="banner" id="r-banner"></div>
      <div class="status" id="r-status"></div>
      <div class="recap" id="r-recap"></div>
      <div class="choices" id="r-choices"></div>
      <div class="actions">
        <button type="button" class="btn" id="btn-next">次の問題へ</button>
      </div>
    </section>

    <section id="screen-score" class="screen">
      <p class="note">お疲れさまでした。</p>
      <div class="score-label">スコア</div>
      <div class="score-num" id="score-num"></div>
      <div class="actions">
        <button type="button" class="btn" id="btn-home">タイトルへ戻る</button>
      </div>
    </section>
  </main>

    function unpack(rows) {
      return rows.map(function (row) {
        return { slug: row[0], char: row[1], name: row[2], command: row[3], answer: row[4] };
      });
    }

    function fmtInt(n) {
      return n > 0 ? "+" + n : String(n);
    }

    function shuffle(list) {
      var a = list.slice();
      for (var i = a.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = a[i];
        a[i] = a[j];
        a[j] = t;
      }
      return a;
    }

    function makeChoices(answer) {
      var offset = Math.floor(Math.random() * 4);
      var start = -offset;
      var range = answer.match(RANGE_RE);
      var opts = [];
      var i, k;
      if (range) {
        var lo = parseInt(range[1], 10);
        var hi = parseInt(range[2], 10);
        for (i = 0; i < 4; i++) {
          k = start + i;
          opts.push(fmtInt(lo + k) + "～" + fmtInt(hi + k));
        }
      } else {
        var n = parseInt(answer, 10);
        for (i = 0; i < 4; i++) {
          opts.push(fmtInt(n + start + i));
        }
      }
      return opts;
    }

    function pickRun(pool, count) {
      return shuffle(pool).slice(0, Math.min(count, pool.length));
    }

    var allItems = unpack(QUIZ_ROWS);

    function itemsFor(slug) {
      return allItems.filter(function (item) { return item.slug === slug; });
    }

    var state = {
      screen: "title",
      pendingMode: null,
      questions: [],
      index: 0,
      choices: [],
      picked: null,
      correctCount: 0
    };

    function $(id) { return document.getElementById(id); }

    function show(name) {
      state.screen = name;
      ["title", "select", "question", "result", "score"].forEach(function (key) {
        $("screen-" + key).classList.toggle("on", key === name);
      });
    }

    function beginRun(pool, count) {
      var run = pickRun(pool, count);
      if (!run.length) return;
      state.questions = run;
      state.index = 0;
      state.choices = makeChoices(run[0].answer);
      state.picked = null;
      state.correctCount = 0;
      state.pendingMode = null;
      renderQuestion();
      show("question");
    }

    function renderQuestion() {
      var q = state.questions[state.index];
      var total = state.questions.length;
      $("q-progress").textContent = (state.index + 1) + " / " + total;
      $("q-char").textContent = q.char;
      $("q-name").textContent = q.name;
      $("q-command").textContent = q.command || "";
      $("q-command").style.display = q.command ? "block" : "none";
      var box = $("q-choices");
      box.innerHTML = "";
      state.choices.forEach(function (choice) {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "choice";
        b.textContent = choice;
        b.addEventListener("click", function () { answer(choice); });
        box.appendChild(b);
      });
    }

    function burst() {
      var el = $("r-confetti");
      el.innerHTML = "";
      var colors = ["#c4b5fd", "#a78bfa", "#f0abfc", "#818cf8", "#4ade80", "#fbbf24"];
      for (var i = 0; i < 16; i++) {
        var d = document.createElement("i");
        var dx = (i % 2 === 0 ? -22 : 22);
        d.style.left = (6 + ((i * 17) % 88)) + "%";
        d.style.width = (5 + (i % 4) * 2) + "px";
        d.style.height = d.style.width;
        d.style.background = colors[i % colors.length];
        d.style.setProperty("--dx", dx + "px");
        d.style.animationDelay = ((i % 8) * 0.05) + "s";
        d.style.animationDuration = (0.9 + (i % 4) * 0.12) + "s";
        el.appendChild(d);
      }
    }

    function renderResult() {
      var q = state.questions[state.index];
      var total = state.questions.length;
      var ok = state.picked === q.answer;
      var last = state.index >= total - 1;
      $("r-progress").textContent = (state.index + 1) + " / " + total;
      $("r-banner").textContent = ok ? "正解！" : "不正解";
      $("r-banner").className = "banner " + (ok ? "ok" : "ng");
      $("r-status").className = "status " + (ok ? "ok" : "ng");
      $("r-status").textContent = ok
        ? ("正解は " + q.answer)
        : ("正解は " + q.answer + "（あなたの回答 " + state.picked + "）");
      $("r-recap").textContent = q.char + "　" + q.name + (q.command ? "　" + q.command : "");
      $("btn-next").textContent = last ? "結果を見る" : "次の問題へ";
      $("r-confetti").innerHTML = "";
      if (ok) burst();
      var box = $("r-choices");
      box.innerHTML = "";
      state.choices.forEach(function (choice) {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "choice";
        if (choice === q.answer) b.classList.add("correct");
        else if (choice === state.picked) b.classList.add("wrong");
        else b.classList.add("muted");
        b.disabled = true;
        b.textContent = choice;
        box.appendChild(b);
      });
    }

    function answer(value) {
      var q = state.questions[state.index];
      if (!q || state.picked !== null) return;
      state.picked = value;
      if (value === q.answer) state.correctCount += 1;
      renderResult();
      show("result");
    }

    function goNext() {
      var total = state.questions.length;
      if (state.index >= total - 1) {
        $("score-num").textContent = state.correctCount + " / " + total;
        show("score");
        return;
      }
      state.index += 1;
      state.choices = makeChoices(state.questions[state.index].answer);
      state.picked = null;
      renderQuestion();
      show("question");
    }

    function backToTitle() {
      state.pendingMode = null;
      state.questions = [];
      state.index = 0;
      state.choices = [];
      state.picked = null;
      state.correctCount = 0;
      show("title");
    }

    function renderCharGrid() {
      var grid = $("char-grid");
      grid.innerHTML = "";
      CHARACTERS.forEach(function (ch) {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "char-btn";
        b.textContent = ch.name;
        b.addEventListener("click", function () {
          var pool = itemsFor(ch.slug);
          var count = state.pendingMode === "charAll" ? pool.length : 10;
          beginRun(pool, count);
        });
        grid.appendChild(b);
      });
    }

    function openSelect(mode) {
      state.pendingMode = mode;
      $("select-lead").textContent = mode === "charAll"
        ? "キャラクターの出題対象の技を、すべて出題します。"
        : "選んだキャラクターから10問出題します。";
      show("select");
    }

    renderCharGrid();
    $("btn-random").addEventListener("click", function () { beginRun(allItems, 10); });
    $("btn-char10").addEventListener("click", function () { openSelect("char10"); });
    $("btn-charall").addEventListener("click", function () { openSelect("charAll"); });
    $("btn-select-back").addEventListener("click", backToTitle);
    $("btn-next").addEventListener("click", goNext);
    $("btn-home").addEventListener("click", backToTitle);
  </script>
</body>
</html>
